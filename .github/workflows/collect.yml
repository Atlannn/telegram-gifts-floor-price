name: Collect floor prices

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write           # lets the built-in token commit the new data

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python collect.py
      - name: Redraw charts (Mondays and manual runs)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            pip install matplotlib
            python charts.py
          fi
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data charts
          git diff --cached --quiet || git commit -m "Update floor prices $(date -u +%F)"
          git push
